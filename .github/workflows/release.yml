name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must exist), e.g. v1.1.0
        required: true

permissions:
  contents: write

env:
  PANEL_REF: v2.0.0-beta.3

jobs:
  release:
    name: Build and publish the .pteroext
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup
        with:
          panel-ref: ${{ env.PANEL_REF }}

      - run: npm run release

      - name: Check the tag matches the manifest version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(node -p "require('./packages/obsidian/extension.json').version")
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::Tag $tag does not match extension.json version $version"; exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" release/themes/*.pteroext \
            --title "Obsidian $tag" \
            --generate-notes \
            --verify-tag || gh release upload "$tag" release/themes/*.pteroext --clobber
